[project]
classifiers = [
    'Programming Language :: Python :: 3.12',
    'License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)',
    'Operating System :: OS Independent',
]
dependencies = [
    'aiohttp',
    'django',
    'django-storages[s3]',
]
description = 'Cookiecutter template for continuously bootstrapped repos'
name = 'measles'
requires-python = '>=3.12'
version = '0'

[project.optional-dependencies]
precommit = [
    'actionlint-py',
    'basedpyright',
    'cookiecutter',
    'django-upgrade',
    'djlint',
    'factory-boy',
    'hadolint-py @ git+https://github.com/AleksaC/hadolint-py.git',
    'helicopyter @ git+https://github.com/biobuddies/helicopyter.git@0a5639d9b887d73d482950f5438a19dee751169c',
    'pre-commit-hooks',
    'pytest',
    'pytest-cov',
    'ruff',
    'shellcheck-py',
    'shfmt-py',
    'typos',
    'validate-pyproject[all]',
    'yamllint',
]

[tool.basedpyright]
extends = '.biobuddies/basedpyright.toml'
failOnWarnings = false

[tool.ruff]
extend = '.biobuddies/ruff.toml'
